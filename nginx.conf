server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Angular router uses path-based URLs (/app/dashboard etc.) - fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Build assets use content hashes (outputHashing: all), so they can be cached forever
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # The app shell itself must always be revalidated
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
