<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NewProject</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Theme Settings font choices (fall back to the UI sans when offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Lato&family=Montserrat&family=Nunito&family=Poppins&family=Roboto&display=swap" rel="stylesheet">

    <style>
    :root {
      --ink: #202333;
      --muted: #707788;
      --line: #e8e9ee;
      --bg: #f6f7fa;
      --white: #fff;
      --accent: #7c3348;
      --accentbg: #fbf0f3;
      --teal: #138879;
      --blue: #4169c4;
      --orange: #c78028;
      --purple: #8763bd;
      --red: #bd4d53;
      --radius: 13px;
      --shadow: 0 4px 18px #22283f04
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: var(--font-body, Inter, "Segoe UI", Arial, sans-serif);
      font-size: var(--font-size, 13px);
      font-weight: var(--font-weight, 400);
      line-height: var(--line-height, 1.5);
      color: var(--ink);
      background: var(--bg)
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    button,
    a,
    select,
    input[type=checkbox] {
      cursor: pointer
    }

    button {
      color: inherit
    }

    button:focus-visible,
    a:focus-visible,
    select:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #aac5f1;
      outline-offset: 2px
    }

    button {
      border: 0;
      background: none
    }

    a {
      color: var(--accent)
    }

    svg {
      vertical-align: middle
    }

    h1,
    h2,
    h3,
    p {
      margin: 0
    }

    h1 {
      font-family: var(--font-heading, inherit);
      color: var(--heading-color, inherit);
      font-size: 27px;
      letter-spacing: -.85px;
      font-weight: 650
    }

    h2 {
      font-family: var(--font-heading, inherit);
      color: var(--heading-color, inherit);
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.2px
    }

    h3 {
      font-family: var(--font-heading, inherit);
      color: var(--heading-color, inherit);
      font-size: 13px;
      font-weight: 650
    }

    small {
      font-size: 11px
    }

    .muted {
      color: var(--muted)
    }

    .tiny {
      font-size: 10px;
      letter-spacing: .5px
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 1.6px;
      font-size: 10px;
      font-weight: 650;
      color: var(--muted)
    }

    .num {
      font-variant-numeric: tabular-nums;
      font-family: var(--font-number, inherit)
    }

    .flex {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .between {
      justify-content: space-between
    }

    .wrap {
      flex-wrap: wrap
    }

    .stack>*+* {
      margin-top: 14px
    }

    .right {
      text-align: right
    }

    .green {
      color: var(--teal)
    }

    .red {
      color: var(--red)
    }

    .amber {
      color: var(--orange)
    }

    .blue {
      color: var(--blue)
    }

    .bold {
      font-weight: 600
    }

    .nowrap {
      white-space: nowrap
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      margin-right: 6px
    }

    .spacer {
      flex: 1
    }

    .ico {
      width: 18px;
      height: 18px;
      flex: 0 0 18px
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: var(--btn-radius, 8px);
      background: var(--white)
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: var(--white);
      border: 1px solid #dfe2e9;
      border-radius: var(--btn-radius, 7px);
      padding: 8px 12px;
      font-weight: 550;
      font-size: 12px;
      white-space: nowrap
    }

    .btn:hover,
    .icon-btn:hover {
      background: #f6f6f8
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff
    }

    .btn.primary:hover {
      background: #69293c
    }

    .btn.small {
      padding: 5px 9px;
      font-size: 11px
    }

    .btn.quiet {
      border-color: transparent;
      background: transparent;
      color: var(--accent)
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 5px;
      padding: 3px 7px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      background: #f0f2f6;
      color: #606b7d
    }

    .badge.teal {
      background: #e9f6f2;
      color: #157969
    }

    .badge.blue {
      background: #edf2fd;
      color: #4266b7
    }

    .badge.amber {
      background: #fff5e7;
      color: #a9691b
    }

    .badge.rose {
      background: #fcf0f2;
      color: #a94b61
    }

    .badge.purple {
      background: #f4effb;
      color: #7d56b2
    }

    .badge.red {
      background: #fbeeee;
      color: #b64c51
    }

    .avatar {
      width: 31px;
      height: 31px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f0e8ed;
      border: 2px solid white;
      border-radius: 50%;
      color: var(--accent);
      font-size: 10px;
      font-weight: 650;
      flex-shrink: 0
    }

    .avatar.blue {
      background: #e9f0fc;
      color: #4169c4
    }

    .avatar.teal {
      background: #e6f3ee;
      color: #168373
    }

    .app {
      display: grid;
      grid-template-columns: 264px 1fr;
      min-height: 100vh
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: white;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding: 24px 15px 12px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px 24px
    }

    .mark {
      background: var(--accent);
      width: 33px;
      height: 37px;
      display: grid;
      place-items: center;
      color: white;
      border-radius: 8px;
      font-family: Georgia, serif;
      font-size: 25px
    }

    .brand strong {
      font-size: 23px;
      letter-spacing: -1px;
      line-height: 1
    }

    .brand small {
      display: block;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1.7px;
      color: var(--muted);
      margin-top: 4px
    }

    .workspace {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
      margin-bottom: 17px;
      background: #fcfcfd
    }

    .workspace .w-icon {
      background: #f1edf0;
      padding: 7px;
      border-radius: 6px
    }

    .nav {
      overflow: auto;
      flex: 1;
      scrollbar-width: thin
    }

    .navlabel {
      font-size: 9px;
      color: #979baa;
      letter-spacing: 1.2px;
      font-weight: 650;
      padding: 15px 12px 6px;
      text-transform: uppercase
    }

    .nav button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      border-radius: 7px;
      color: #606678;
      text-align: left;
      margin: 2px 0;
      font-size: 12px;
      position: relative
    }

    .nav button:hover {
      background: #f7f7fa
    }

    .nav button.active {
      background: var(--accentbg);
      color: var(--accent);
      font-weight: 650
    }

    .nav button.active:before {
      content: "";
      height: 18px;
      width: 3px;
      position: absolute;
      left: -15px;
      background: var(--accent);
      border-radius: 4px
    }

    .navcount {
      margin-left: auto;
      font-size: 10px;
      background: #f3e2e8;
      padding: 1px 6px;
      border-radius: 4px
    }

    .sidefoot {
      padding: 12px 9px 2px;
      border-top: 1px solid var(--line);
      margin-top: 10px
    }

    .sidefoot p {
      font-size: 10px;
      color: var(--muted);
      margin-top: 6px
    }

    .main {
      min-width: 0
    }

    .topbar {
      height: 67px;
      background: var(--white);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 30px
    }

    .breadcrumb {
      font-size: 12px;
      color: var(--muted)
    }

    .breadcrumb strong {
      color: #555d70;
      font-weight: 500
    }

    .topbar select {
      border: 0;
      background: transparent;
      color: #525a6b;
      max-width: 200px;
      font-size: 12px
    }

    .topbar .rolebox {
      border-left: 1px solid var(--line);
      padding-left: 15px
    }

    .topbar .rolebox small {
      font-size: 9px;
      display: block;
      color: var(--muted);
      line-height: 1.3
    }

    .demo-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fffdf9;
      border-bottom: 1px solid #eee9dd;
      padding: 6px 30px;
      color: #8b7d5b;
      font-size: 10px
    }

    .content {
      padding: 26px 30px 35px;
      max-width: 2060px;
      margin: auto
    }

    .pagehead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px
    }

    .pagehead p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px
    }

    .scopebar {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
      flex-wrap: wrap
    }

    .scopebar select,
    .scopebar input,
    .filter-input {
      background: white;
      border: 1px solid #e1e4ec;
      border-radius: 7px;
      padding: 8px 10px;
      color: #555e70
    }

    .scopebar label {
      color: var(--muted);
      font-size: 11px
    }

    .scopebar .search {
      min-width: 240px
    }

    .tabs {
      display: flex;
      gap: 20px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      margin: 0 0 18px
    }

    .tabs button {
      padding: 9px 0 11px;
      color: var(--muted);
      font-size: 12px;
      position: relative
    }

    .tabs button.active {
      color: var(--accent);
      font-weight: 600
    }

    .tabs button.active:after {
      content: "";
      height: 2px;
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      background: var(--accent)
    }

    .tabs .badge {
      margin-left: 4px
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-width: 0;
      overflow: hidden
    }

    .card-head {
      padding: 17px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px
    }

    .card-head p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px
    }

    .card-body {
      padding: 0 20px 18px
    }

    .card-foot {
      padding: 11px 20px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: var(--muted);
      background: #fdfdfe
    }

    .grid {
      display: grid;
      gap: 18px
    }

    .g4 {
      grid-template-columns: repeat(4, minmax(0, 1fr))
    }

    .g3 {
      grid-template-columns: repeat(3, minmax(0, 1fr))
    }

    .g2 {
      grid-template-columns: repeat(2, minmax(0, 1fr))
    }

    .g21 {
      grid-template-columns: minmax(0, 1.9fr) minmax(280px, 1fr)
    }

    .g12 {
      grid-template-columns: minmax(280px, 1fr) minmax(0, 1.9fr)
    }

    .mb {
      margin-bottom: 18px
    }

    .stat {
      padding: 18px 20px 15px;
      position: relative
    }

    .stat-label {
      font-size: 11px;
      color: #6f7688;
      font-weight: 550;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .stat-label .stat-icon {
      background: #f7f0f3;
      color: var(--accent);
      border-radius: 7px;
      padding: 6px
    }

    .stat strong.value {
      font-size: 29px;
      font-weight: 650;
      line-height: 1.7;
      letter-spacing: -1px;
      display: block
    }

    .stat .stat-note {
      font-size: 10px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 7px
    }

    .spark {
      position: absolute;
      right: 20px;
      bottom: 23px;
      width: 74px;
      height: 27px
    }

    .progress {
      height: 5px;
      background: #f0f1f5;
      border-radius: 5px;
      overflow: hidden
    }

    .progress>span {
      display: block;
      height: 100%;
      border-radius: 5px;
      background: var(--accent)
    }

    .metric-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px
    }

    .metric-line small {
      color: var(--muted)
    }

    .legend {
      display: flex;
      gap: 16px;
      font-size: 10px;
      color: var(--muted)
    }

    .chart {
      width: 100%;
      display: block
    }

    .chart text {
      font-family: inherit;
      font-size: 10px;
      fill: #9299a9
    }

    .chart .gridline {
      stroke: #eef0f4;
      stroke-dasharray: 3 4;
      stroke-width: 1
    }

    .chart-label {
      font-size: 11px;
      color: var(--muted)
    }

    .tablewrap {
      overflow: auto
    }

    table {
      border-collapse: collapse;
      width: 100%;
      text-align: left;
      font-size: 12px
    }

    th {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .65px;
      color: #9297a5;
      font-weight: 600;
      background: #fcfcfd;
      white-space: nowrap;
      padding: 11px 15px;
      border-bottom: 1px solid var(--line)
    }

    td {
      padding: 12px 15px;
      border-bottom: 1px solid #eff0f4;
      vertical-align: middle
    }

    tbody tr:last-child td {
      border-bottom: 0
    }

    tbody tr:hover {
      background: #fcfcfe
    }

    td small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 3px
    }

    td .link {
      font-weight: 600;
      color: var(--ink);
      text-align: left;
      padding: 0
    }

    .link:hover {
      color: var(--accent);
      text-decoration: underline
    }

    .row-title {
      font-weight: 600
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted)
    }

    .microstats {
      display: flex;
      gap: 22px;
      border-top: 1px solid var(--line);
      padding-top: 15px;
      margin-top: 15px
    }

    .microstats strong {
      font-size: 17px;
      display: block;
      font-weight: 600
    }

    .microstats small {
      font-size: 10px;
      color: var(--muted)
    }

    .priority-item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid var(--line)
    }

    .priority-item:last-child {
      border-bottom: 0
    }

    .priority-icon {
      padding: 8px;
      border-radius: 8px;
      color: var(--orange);
      background: #fff6eb
    }

    .priority-item p {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px
    }

    .priority-item h3 {
      font-size: 12px
    }

    .panel-note {
      padding: 13px 16px;
      border: 1px solid #e5eaf2;
      background: #f8faff;
      border-radius: 8px;
      font-size: 11px;
      color: #647087
    }

    .panel-note.amber {
      background: #fffaf1;
      border-color: #f0e7d3;
      color: #9a7d45
    }

    .panel-note.rose {
      background: #fcf4f6;
      border-color: #f1e1e7;
      color: #895268
    }

    .ring {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--teal) 0deg 268deg, #edf3f1 268deg 360deg);
      position: relative;
      margin: auto
    }

    .ring:before {
      content: "";
      position: absolute;
      inset: 11px;
      border-radius: 50%;
      background: white
    }

    .ring>div {
      z-index: 1;
      text-align: center
    }

    .ring strong {
      font-size: 28px;
      font-weight: 650;
      display: block
    }

    .ring small {
      font-size: 10px;
      color: var(--muted)
    }

    .bar-row {
      display: grid;
      grid-template-columns: 88px 1fr 65px;
      gap: 12px;
      align-items: center;
      margin-bottom: 17px;
      font-size: 11px
    }

    .bar-row:last-child {
      margin-bottom: 0
    }

    .bar-row .progress {
      height: 8px
    }

    .kanban {
      display: grid;
      grid-template-columns: repeat(5, minmax(210px, 1fr));
      gap: 13px;
      overflow: auto;
      padding-bottom: 10px
    }

    .column {
      background: #f0f2f6;
      border-radius: 10px;
      padding: 12px;
      min-height: 400px
    }

    .column-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
      font-size: 12px;
      font-weight: 600
    }

    .column-head small {
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      display: block;
      margin-top: 4px
    }

    .deal {
      padding: 14px;
      background: white;
      border: 1px solid #e5e7ef;
      border-radius: 8px;
      margin-bottom: 11px;
      box-shadow: 0 2px 5px #00000002
    }

    .deal[draggable=true] {
      cursor: grab
    }

    .deal h3 {
      font-size: 12px;
      margin: 9px 0 2px
    }

    .deal p {
      color: var(--muted);
      font-size: 10px
    }

    .deal .deal-money {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -.3px;
      margin: 11px 0
    }

    .deal select {
      max-width: 130px;
      font-size: 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      padding: 4px;
      color: #646b7c
    }

    .deal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--line);
      padding-top: 9px;
      margin-top: 11px;
      font-size: 10px
    }

    .column.dragover {
      outline: 2px dashed var(--accent);
      background: #f7eef2
    }

    .agenda {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 13px;
      margin: 0 0 18px
    }

    .agenda .time {
      font-size: 11px;
      font-weight: 550;
      color: var(--muted);
      padding-top: 4px
    }

    .agenda .event {
      border-left: 3px solid var(--accent);
      padding: 9px 12px;
      background: #fcf6f8;
      border-radius: 0 7px 7px 0
    }

    .agenda .event p {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px
    }

    .activity {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line)
    }

    .activity:last-child {
      border: 0
    }

    .activity p {
      font-size: 11px;
      color: var(--muted)
    }

    .activity small {
      font-size: 10px;
      color: var(--muted)
    }

    .account-card {
      padding: 20px
    }

    .account-card h2 {
      font-size: 15px;
      margin: 12px 0 3px
    }

    .account-symbol {
      height: 42px;
      width: 42px;
      border: 1px solid var(--line);
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: 17px;
      color: var(--accent);
      background: #fcf8fa
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 17px
    }

    .detail-grid .field-label {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 3px
    }

    .detail-grid .field-value {
      font-size: 12px;
      font-weight: 550
    }

    .detail-hero {
      padding: 22px;
      background: linear-gradient(120deg, #fcf5f7, #fff 75%);
      border-bottom: 1px solid var(--line)
    }

    .detail-hero h2 {
      font-size: 22px;
      margin: 6px 0
    }

    .steps {
      display: flex;
      gap: 6px;
      padding: 16px 0;
      flex-wrap: wrap
    }

    .step {
      background: #eef0f5;
      border-radius: 5px;
      padding: 7px 12px;
      font-size: 10px;
      color: #7b8191
    }

    .step.done {
      background: #edf5f2;
      color: var(--teal)
    }

    .step.current {
      background: var(--accent);
      color: white
    }

    .calendar {
      display: grid;
      grid-template-columns: 90px repeat(7, minmax(130px, 1fr));
      overflow: auto
    }

    .calendar>div {
      min-height: 83px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 9px
    }

    .calendar .day {
      min-height: 50px;
      font-size: 11px;
      font-weight: 600;
      background: #fcfcfd
    }

    .calendar .venue {
      font-size: 10px;
      color: var(--muted)
    }

    .cal-event {
      padding: 7px;
      background: #f0ebf8;
      border-left: 3px solid var(--purple);
      border-radius: 4px;
      font-size: 10px;
      margin-bottom: 6px
    }

    .cal-event.teal {
      background: #eaf7f2;
      border-color: var(--teal)
    }

    .cal-event.amber {
      background: #fff4e4;
      border-color: var(--orange)
    }

    .cal-event b {
      display: block
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px
    }

    .report-card {
      padding: 18px;
      display: flex;
      gap: 12px
    }

    .report-card .report-icon {
      padding: 8px;
      border-radius: 8px;
      background: #f5f0f4;
      color: var(--accent);
      align-self: flex-start
    }

    .report-card p {
      font-size: 11px;
      color: var(--muted);
      margin: 5px 0 12px
    }

    .heat {
      display: grid;
      grid-template-columns: 110px repeat(5, 1fr);
      gap: 6px;
      align-items: center;
      font-size: 10px
    }

    .heat div {
      border-radius: 4px;
      min-height: 30px;
      padding: 5px;
      display: grid;
      place-items: center
    }

    .heat .heat-name {
      justify-content: start;
      color: var(--muted)
    }

    .matrix td,
    .matrix th {
      font-size: 10px;
      padding: 10px 12px
    }

    .matrix td:not(:first-child) {
      text-align: center
    }

    .matrix .yes {
      color: var(--teal);
      font-weight: 650
    }

    .matrix .no {
      color: #b8becb
    }

    .guide {
      max-width: 1400px
    }

    .guide p {
      font-size: 12px;
      color: #636c7f;
      line-height: 1.8
    }

    .guide .card-body p+p {
      margin-top: 10px
    }

    .guide h3 {
      font-size: 13px;
      margin-bottom: 6px
    }

    .guide ol,
    .guide ul {
      padding-left: 18px;
      font-size: 12px;
      color: #636c7f
    }

    .guide li {
      margin: 7px 0
    }

    .guide details {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      margin-bottom: 10px;
      overflow: hidden
    }

    .guide summary {
      padding: 14px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer
    }

    .guide details>div {
      padding: 0 18px 18px
    }

    .guide .source-list a {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px
    }

    .guide .source-list li {
      padding: 10px 0;
      border-bottom: 1px solid var(--line)
    }

    .roadmap {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px
    }

    .phase {
      padding: 17px;
      border-top: 3px solid var(--accent)
    }

    .phase .number {
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 8px
    }

    .keyline {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 15px;
      font-size: 12px
    }

    .keyline:last-child {
      border-bottom: 0
    }

    .keyline small {
      color: var(--muted)
    }

    .notice {
      border-left: 3px solid var(--accent);
      padding: 10px 15px;
      background: #fbf7f9;
      font-size: 12px;
      margin: 15px 0
    }

    .footer {
      display: flex;
      justify-content: space-between;
      color: #969cac;
      font-size: 10px;
      margin-top: 25px
    }

    dialog {
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: 0 25px 90px #1e23342e;
      width: min(800px, calc(100% - 30px));
      max-height: 90vh;
      padding: 0;
      color: var(--ink)
    }

    dialog::backdrop {
      background: #1b22366b;
      backdrop-filter: blur(2px)
    }

    .modal-head {
      padding: 19px 23px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .modal-head h2 {
      font-size: 18px
    }

    .modal-body {
      padding: 22px
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding: 15px 23px;
      border-top: 1px solid var(--line);
      background: #fafbfd
    }

    .formgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px
    }

    .formgrid label {
      font-size: 11px;
      color: #687085;
      display: block
    }

    .formgrid input,
    .formgrid select,
    .formgrid textarea {
      display: block;
      width: 100%;
      border: 1px solid #dfe3ec;
      border-radius: 7px;
      padding: 9px 10px;
      margin-top: 5px;
      color: var(--ink);
      background: white
    }

    .formgrid .full {
      grid-column: 1/-1
    }

    .formgrid textarea {
      min-height: 76px;
      resize: vertical
    }

    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 8px;
      padding: 12px 18px;
      background: #292e40;
      color: white;
      font-size: 12px;
      box-shadow: 0 8px 25px #0002;
      z-index: 100;
      max-width: 90vw
    }

    .toast[hidden] {
      display: none
    }

    .switcher {
      display: flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white
    }

    .switcher button {
      padding: 5px 9px;
      border-radius: 5px;
      color: var(--muted);
      font-size: 11px
    }

    .switcher button.active {
      background: #f3edf1;
      color: var(--accent)
    }

    .compact td {
      padding-top: 8px;
      padding-bottom: 8px
    }

    .compact .content {
      padding-top: 20px
    }

    .mobile-menu {
      display: none
    }

    .scope-note {
      font-size: 10px;
      color: var(--muted);
      margin: 0 0 14px
    }

    .chipline {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 18px 0
    }

    .checkrow {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      padding: 8px 0
    }

    .checkrow input {
      accent-color: var(--accent)
    }

    .outline-empty {
      border: 1px dashed #dce1eb;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 11px
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0
    }

    @media(min-width:1800px) {
      .content {
        padding: 30px 40px
      }

      .app {
        grid-template-columns: 285px 1fr
      }

      body {
        font-size: 14px
      }

      td {
        padding: 14px 17px;
        font-size: 13px
      }

      .stat strong.value {
        font-size: 34px
      }

      .nav button {
        font-size: 13px;
        padding: 10px 13px
      }

      .card-head {
        padding: 20px 23px 16px
      }

      .card-body {
        padding: 0 23px 22px
      }
    }

    @media(max-width:1250px) {
      .app {
        grid-template-columns: 230px 1fr
      }

      .sidebar {
        padding-left: 10px;
        padding-right: 10px
      }

      .content {
        padding: 22px 22px
      }

      .topbar {
        padding: 0 22px
      }

      .g4 {
        grid-template-columns: repeat(2, 1fr)
      }

      .g21,
      .g12 {
        grid-template-columns: 1fr
      }

      .report-grid {
        grid-template-columns: repeat(2, 1fr)
      }

      .detail-grid {
        grid-template-columns: repeat(2, 1fr)
      }

      .roadmap {
        grid-template-columns: repeat(2, 1fr)
      }

      .topbar .breadcrumb {
        display: none
      }

      .g3 {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    @media(max-width:800px) {
      .app {
        display: block
      }

      .sidebar {
        display: none;
        position: fixed;
        z-index: 50;
        left: 0;
        top: 0;
        width: 230px;
        box-shadow: 0 0 0 100vmax #0005
      }

      .sidebar.open {
        display: flex
      }

      .mobile-menu {
        display: grid
      }

      .content {
        padding: 18px 15px
      }

      .topbar {
        padding: 0 15px;
        gap: 10px;
        height: 65px
      }

      .topbar select {
        max-width: 145px;
        font-size: 11px
      }

      .topbar .rolebox {
        padding-left: 8px
      }

      .topbar .top-user {
        display: none
      }

      .demo-strip {
        padding: 6px 15px;
        gap: 10px;
        font-size: 9px
      }

      .demo-strip span:last-child {
        display: none
      }

      .pagehead {
        align-items: flex-start;
        flex-wrap: wrap
      }

      h1 {
        font-size: 24px
      }

      .g2,
      .g3,
      .report-grid {
        grid-template-columns: 1fr
      }

      .grid {
        gap: 13px
      }

      .g4 {
        gap: 10px
      }

      .stat {
        padding: 14px
      }

      .stat strong.value {
        font-size: 24px
      }

      .stat .stat-note {
        font-size: 9px
      }

      .stat .spark {
        display: none
      }

      .scopebar .search {
        min-width: 160px;
        flex: 1
      }

      .formgrid {
        grid-template-columns: 1fr
      }

      .formgrid .full {
        grid-column: auto
      }

      .detail-grid {
        grid-template-columns: 1fr 1fr
      }

      .card-head {
        padding: 15px
      }

      .card-body {
        padding: 0 15px 15px
      }

      .tabs {
        overflow: auto;
        gap: 18px;
        white-space: nowrap
      }

      .footer {
        gap: 10px;
        font-size: 9px
      }

      .roadmap {
        grid-template-columns: 1fr
      }

      .scopebar select {
        max-width: 100%
      }
    }

    @media print {

      .sidebar,
      .topbar,
      .demo-strip,
      .pagehead .actions,
      .scopebar,
      .btn,
      .footer,
      .toast,
      dialog {
        display: none !important
      }

      .app {
        display: block
      }

      .content {
        padding: 0
      }

      body {
        background: white
      }

      .card {
        break-inside: avoid;
        box-shadow: none
      }

      .tablewrap {
        overflow: visible
      }

      .grid {
        gap: 12px
      }

      th,
      td {
        font-size: 9px;
        padding: 7px
      }

      .print-hide {
        display: none
      }

      .card-head {
        padding: 10px
      }

      .card-body {
        padding: 0 10px 10px
      }

      a {
        color: inherit
      }

      .guide details>div {
        display: block
      }

      .guide details {
        break-inside: avoid
      }

      h1 {
        font-size: 23px
      }

      .g4 {
        grid-template-columns: repeat(4, 1fr)
      }
    }

    th {
      font-size: 10.5px;
      color: #717a8c
    }

    .eyebrow,
    .tiny,
    .navlabel {
      font-size: 10px
    }

    .card-head p,
    .stat-label {
      font-size: 11.5px
    }

    .tablewrap small {
      color: #737b8c
    }

    .badge {
      font-size: 10.5px
    }

    .stat .value {
      overflow-wrap: anywhere
    }

    .scopebar select:focus-visible,
    .scopebar input:focus-visible,
    .filter-input:focus-visible {
      outline: 3px solid #aac5f1;
      outline-offset: 2px
    }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
